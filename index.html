<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Southern Leyte Cooperative — Staff Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0a0a0a;--green:#1a8a3c;--gl:#22a84a;--gp:#e8f7ed;--gm:#d0f0da;--gray:#f5f5f3;--gray2:#e8e8e5;--text:#1a1a1a;--muted:#555;--red:#c0392b;--amber:#d4820a;--blue:#1a4a8a;--purple:#6c3483}
body{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;color:var(--text);background:var(--gray);min-height:100vh}

/* LOGIN */
.login-screen{min-height:100vh;background:var(--black);display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.login-screen::before{content:'';position:absolute;top:-100px;right:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(26,138,60,.15) 0%,transparent 70%);pointer-events:none}
.login-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:44px 40px;width:100%;max-width:420px;position:relative;z-index:1}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.login-logo-icon{width:44px;height:44px;background:var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:18px}
.login-logo-text{font-size:15px;font-weight:700;color:#fff;line-height:1.3}
.login-logo-text span{color:var(--gl);display:block;font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.login-title{font-size:24px;font-weight:900;color:#fff;margin-bottom:6px}
.login-sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:24px}
.lf{margin-bottom:14px}
.lf label{display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.lf input,.lf select{width:100%;padding:12px 14px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;font-size:14px;color:#fff;font-family:inherit;transition:border .15s}
.lf input:focus,.lf select:focus{outline:none;border-color:var(--green)}
.lf input::placeholder{color:rgba(255,255,255,.25)}
.lf select option{background:#1a1a1a;color:#fff}
.login-btn{width:100%;background:var(--green);color:#fff;border:none;padding:13px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;font-family:inherit;transition:background .15s}
.login-btn:hover{background:var(--gl)}
.login-error{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.3);color:#f1948a;padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:14px;display:none}
.login-note{font-size:11px;color:rgba(255,255,255,.2);text-align:center;margin-top:14px}

/* TOPBAR */
.topbar{background:var(--black);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.topbar-logo{display:flex;align-items:center;gap:10px}
.topbar-logo-icon{width:32px;height:32px;background:var(--green);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:13px}
.topbar-logo-text{font-size:13px;font-weight:700;color:#fff;line-height:1.2}
.topbar-logo-text span{color:var(--gl);display:block;font-size:9px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:10px}
.role-badge{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:700;border:1px solid}
.role-badge.admin{background:rgba(108,52,131,.2);color:#d98dff;border-color:rgba(108,52,131,.4)}
.role-badge.manager{background:rgba(26,74,138,.2);color:#7eb3ff;border-color:rgba(26,74,138,.4)}
.role-badge.supervisor{background:rgba(26,138,60,.2);color:var(--gl);border-color:rgba(26,138,60,.4)}
.role-badge.officer{background:rgba(212,130,10,.2);color:#ffcc55;border-color:rgba(212,130,10,.4)}
.topbar-user{font-size:11px;color:rgba(255,255,255,.5);text-align:right;line-height:1.4}
.topbar-user b{color:rgba(255,255,255,.85);display:block}
.logout-btn{background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.1);padding:6px 13px;border-radius:7px;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;transition:all .15s}
.logout-btn:hover{background:rgba(255,255,255,.12);color:#fff}

/* MAIN */
.main{max-width:980px;margin:0 auto;padding:20px 14px}
.tabs{display:flex;gap:3px;background:#fff;border-radius:10px;padding:5px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:7px 12px;border:none;background:none;cursor:pointer;font-size:11px;color:#888;border-radius:7px;font-weight:700;transition:all .15s;white-space:nowrap;font-family:inherit}
.tab.active{background:var(--black);color:#fff}
.tab:hover:not(.active){background:var(--gray);color:var(--black)}
.tab.has-badge{position:relative}
.tab-badge{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;font-size:9px;font-weight:700;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.stat{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-left:3px solid var(--green)}
.stat-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.stat-value{font-size:20px;font-weight:800;color:var(--black)}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-value.amber{color:var(--amber)}
.stat-value.blue{color:var(--blue)}
.stat-value.purple{color:var(--purple)}

/* QUICK ACTION CARDS */
.quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:18px}
.qa-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1.5px solid var(--gray2);cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:12px}
.qa-card:hover{border-color:var(--green);box-shadow:0 4px 14px rgba(26,138,60,.1);transform:translateY(-1px)}
.qa-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.qa-icon.green{background:var(--gp)}
.qa-icon.amber{background:#fff8e8}
.qa-icon.blue{background:#e8f0fa}
.qa-icon.purple{background:#f5eafa}
.qa-title{font-size:13px;font-weight:700;color:var(--black);line-height:1.3}
.qa-sub{font-size:10px;color:var(--muted);margin-top:2px}

/* CARDS */
.card{background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.card-title{font-weight:700;font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.06em}

/* FORMS */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.fl{font-size:11px;color:#888;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;padding:8px 11px;border:1.5px solid var(--gray2);border-radius:8px;font-size:13px;background:#fff;color:var(--text);font-family:inherit;transition:border .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}

/* BUTTONS */
.btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--gray2);background:#fff;color:var(--text);cursor:pointer;font-size:11px;font-weight:700;transition:all .12s;white-space:nowrap;font-family:inherit}
.btn:hover{background:var(--gray)}
.btn.primary{background:var(--black);color:#fff;border-color:var(--black)}
.btn.primary:hover{background:#222}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.green:hover{background:var(--gl)}
.btn.success{background:var(--gp);color:var(--green);border-color:var(--gm)}
.btn.warn{background:#fff8e8;color:var(--amber);border-color:#f0d090}
.btn.danger{color:var(--red);border-color:#f5b7b1;background:#fdecea}
.btn.info{background:#e8f0fa;color:var(--blue);border-color:#b8cce8}
.btn.purple{background:#f5eafa;color:var(--purple);border-color:#d9b8ea}
.btn.sm{padding:4px 10px;font-size:11px}
.btn-row{display:flex;gap:7px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}

/* TABLES */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:7px 9px;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#888;border-bottom:2px solid var(--gray2);background:#fafafa}
td{padding:8px 9px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.badge.paid,.badge.approved,.badge.savings,.badge.completed{background:var(--gp);color:var(--green)}
.badge.partial,.badge.pending,.badge.partial-approval,.badge.pending-sup{background:#fff8e8;color:var(--amber)}
.badge.unpaid,.badge.rejected{background:#fdecea;color:var(--red)}
.badge.loan,.badge.new,.badge.pending-mgr{background:#e8f0fa;color:var(--blue)}
.badge.other{background:var(--gray);color:#666}
.badge.walkin{background:#f5eafa;color:var(--purple)}

/* MISC */
.av{width:28px;height:28px;border-radius:50%;background:var(--gp);color:var(--green);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
.mc{display:flex;align-items:center;gap:8px}
.empty{padding:2.5rem;text-align:center;color:#bbb;font-size:13px}
.sb{background:var(--gray);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;flex-wrap:wrap;gap:6px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--black);color:#fff;padding:10px 18px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .3s;z-index:9999;pointer-events:none;max-width:300px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast.show{opacity:1}
.divider{border:none;border-top:1.5px solid #f0f0f0;margin:12px 0}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:12px}
.info-grid .lbl{color:#888}
.info-grid .val{font-weight:600}
.app-card{background:#fff;border:1.5px solid var(--gray2);border-radius:10px;padding:14px 16px;margin-bottom:10px;transition:all .2s}
.app-card:hover{border-color:var(--green);box-shadow:0 4px 14px rgba(26,138,60,.1)}
.app-card.is-new{border-left:3px solid var(--green)}
.app-card.is-transfer{border-left:3px solid var(--blue)}
.app-card.is-walkin{border-left:3px solid var(--purple)}
.sms-preview{background:var(--gray);border:1.5px solid var(--gray2);border-radius:8px;padding:11px;font-size:12px;margin-top:8px;line-height:1.7;white-space:pre-wrap}
.area-pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#e8f0fa;color:var(--blue)}
.section-label{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
.tpl-box{background:var(--gray);border-radius:8px;padding:12px;margin-bottom:10px;border-left:3px solid var(--green)}
.tpl-box label{font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
.transfer-card{background:#fff;border:1.5px solid var(--gray2);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.transfer-card.pending-sup{border-left:3px solid var(--amber)}
.transfer-card.pending-mgr{border-left:3px solid var(--blue)}
.transfer-card.approved{border-left:3px solid var(--green)}
.transfer-card.rejected{border-left:3px solid var(--red)}
.log-entry{background:var(--gray);border-radius:8px;padding:10px 14px;margin-bottom:7px;border-left:3px solid var(--green)}
.walkin-banner{background:linear-gradient(135deg,#0a0a0a 0%,#1a3a1a 100%);border-radius:12px;padding:18px 20px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.walkin-banner-text h3{color:#fff;font-size:15px;font-weight:800;margin-bottom:3px}
.walkin-banner-text p{color:rgba(255,255,255,.5);font-size:12px}
@media(max-width:600px){.row2,.row3{grid-template-columns:1fr}.tabs{gap:2px}.tab{padding:6px 9px;font-size:10px}.quick-actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">SL</div>
      <div class="login-logo-text">Southern Leyte Cooperative<span>Staff Portal</span></div>
    </div>
    <div class="login-title">Welcome back</div>
    <div class="login-sub">Sign in with your assigned credentials</div>
    <div class="login-error" id="loginError">Incorrect credentials. Please try again.</div>
    <div class="lf"><label>Select Your Account</label><select id="loginUser"><option value="">-- Select your name --</option></select></div>
    <div class="lf"><label>Access PIN</label><input type="password" id="loginPin" placeholder="Enter your PIN" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <p class="login-note">Contact your Supervisor if you forgot your PIN</p>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none">
  <div class="topbar">
    <div class="topbar-logo">
      <div class="topbar-logo-icon">SL</div>
      <div class="topbar-logo-text">Southern Leyte Cooperative<span>Staff Portal</span></div>
    </div>
    <div class="topbar-right">
      <div id="role-badge-wrap"></div>
      <div class="topbar-user"><b id="topbar-name"></b><span id="topbar-area"></span></div>
      <button class="logout-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </div>
  <div class="main">
    <div class="tabs" id="main-tabs"></div>
    <div id="tab-dashboard"></div>
    <div id="tab-applications" style="display:none"></div>
    <div id="tab-members" style="display:none"></div>
    <div id="tab-add-member" style="display:none"></div>
    <div id="tab-collect" style="display:none"></div>
    <div id="tab-history" style="display:none"></div>
    <div id="tab-report" style="display:none"></div>
    <div id="tab-transfers" style="display:none"></div>
    <div id="tab-users" style="display:none"></div>
    <div id="tab-settings" style="display:none"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const todayDate=new Date();
const todayStr=todayDate.toISOString().split('T')[0];
const AREAS=['Hinundayan','Saint Bernard','San Juan','Hinunangan'];

let users=[
  {id:'u1',name:'Admin',role:'admin',area:'All Branches',pin:'0000'},
  {id:'u2',name:'Branch Manager',role:'manager',area:'Pioneering Branch',pin:'1111'},
  {id:'u3',name:'Loan Supervisor',role:'supervisor',area:'Pioneering Branch',pin:'2222'},
  {id:'u4',name:'Officer - Hinundayan',role:'officer',area:'Hinundayan',pin:'3333'},
  {id:'u5',name:'Officer - St. Bernard',role:'officer',area:'Saint Bernard',pin:'4444'},
  {id:'u6',name:'Officer - San Juan',role:'officer',area:'San Juan',pin:'5555'},
  {id:'u7',name:'Officer - Hinunangan',role:'officer',area:'Hinunangan',pin:'6666'},
];

let members=[],transactions=[],applications=[],transferRequests=[],transferLog=[],deletedMembers=[];
let txCounter=1,appCounter=1,trCounter=1;
let currentUser=null,editingMemberId=null,lastReportDate=null,lastReportTx=[];

let settings={
  coopName:'Southern Leyte Cooperative',
  address:'San Juan, Southern Leyte',
  contact:'',
  smsPayment:'Hi {name}, your payment of P{amount} was received on {date}. Ref: {ref}. Remaining balance: P{balance}. Thank you! - {coop}',
  smsApproved:'Hi {name}, your loan application (Ref: {ref}) for P{amount} has been APPROVED. Please visit our office to claim your loan. Bring a valid ID. Thank you! - {coop}',
  smsPartial:'Hi {name}, your loan application (Ref: {ref}) was partially approved. Approved amount: P{approved_amount} out of P{amount}. Visit our office for details. Thank you! - {coop}',
  smsRejected:'Hi {name}, we regret to inform you that your loan application (Ref: {ref}) was not approved at this time. Please visit our office for more information. - {coop}',
};

const KEYS={m:'slcoop3-members',t:'slcoop3-tx',tc:'slcoop3-txc',s:'slcoop3-settings',a:'slcoop3-apps',ac:'slcoop3-appc',u:'slcoop3-users',tr:'slcoop3-transfers',trc:'slcoop3-trc',tl:'slcoop3-tlog',dm:'slcoop3-deleted-members'};
const fmt=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const ini=n=>n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
const genId=()=>'TX'+String(txCounter++).padStart(4,'0');
const genAppId=()=>'APP-'+String(appCounter++).padStart(4,'0');
const genTrId=()=>'TR-'+String(trCounter++).padStart(4,'0');

function showToast(msg,dur=2500){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur);}

function saveData(){
  try{
    localStorage.setItem(KEYS.m,JSON.stringify(members));
    localStorage.setItem(KEYS.t,JSON.stringify(transactions));
    localStorage.setItem(KEYS.tc,String(txCounter));
    localStorage.setItem(KEYS.a,JSON.stringify(applications));
    localStorage.setItem(KEYS.ac,String(appCounter));
    localStorage.setItem(KEYS.u,JSON.stringify(users));
    localStorage.setItem(KEYS.tr,JSON.stringify(transferRequests));
    localStorage.setItem(KEYS.trc,String(trCounter));
    localStorage.setItem(KEYS.tl,JSON.stringify(transferLog));
    localStorage.setItem(KEYS.dm,JSON.stringify(deletedMembers));
  }catch(e){showToast('Save error.');}
}

function loadData(){
  try{const r=localStorage.getItem(KEYS.m);if(r)members=JSON.parse(r);}catch(e){}
  try{const r=localStorage.getItem(KEYS.t);if(r)transactions=JSON.parse(r);}catch(e){}
  try{const r=localStorage.getItem(KEYS.tc);if(r)txCounter=Number(r)||1;}catch(e){}
  try{const r=localStorage.getItem(KEYS.s);if(r)settings={...settings,...JSON.parse(r)};}catch(e){}
  try{const r=localStorage.getItem(KEYS.a);if(r)applications=JSON.parse(r);}catch(e){}
  try{const r=localStorage.getItem(KEYS.ac);if(r)appCounter=Number(r)||1;}catch(e){}
  try{const r=localStorage.getItem(KEYS.u);if(r)users=JSON.parse(r);}catch(e){}
  try{const r=localStorage.getItem(KEYS.tr);if(r)transferRequests=JSON.parse(r);}catch(e){}
  try{const r=localStorage.getItem(KEYS.trc);if(r)trCounter=Number(r)||1;}catch(e){}
  try{const r=localStorage.getItem(KEYS.tl);if(r)transferLog=JSON.parse(r);}catch(e){}
  try{const r=localStorage.getItem(KEYS.dm);if(r)deletedMembers=JSON.parse(r);}catch(e){}
  // Auto-purge deleted members older than 7 days
  const sevenDaysAgo=Date.now()-(7*24*60*60*1000);
  const before=deletedMembers.length;
  deletedMembers=deletedMembers.filter(m=>m.deletedAt&&m.deletedAt>sevenDaysAgo);
  if(deletedMembers.length!==before)saveData();
  if(!members.length){
    members=[
      {id:'MEM-001',name:'Maria Santos',contact:'09123456789',address:'Hinundayan',area:'Hinundayan',type:'loan',sched:'daily',dueAmount:150,loanTotal:18000,loanBal:14250,assignedTo:'u4',source:'online'},
      {id:'MEM-002',name:'Juan dela Cruz',contact:'09234567890',address:'Saint Bernard',area:'Saint Bernard',type:'both',sched:'weekly',dueAmount:500,loanTotal:25000,loanBal:20500,assignedTo:'u5',source:'online'},
      {id:'MEM-003',name:'Ana Reyes',contact:'09345678901',address:'San Juan',area:'San Juan',type:'savings',sched:'monthly',dueAmount:1000,loanTotal:0,loanBal:0,assignedTo:'u6',source:'walkin'},
      {id:'MEM-004',name:'Pedro Lim',contact:'09456789012',address:'Hinunangan',area:'Hinunangan',type:'loan',sched:'daily',dueAmount:200,loanTotal:30000,loanBal:27800,assignedTo:'u7',source:'online'},
    ];
    applications=[
      {id:'APP-0001',fname:'Rosa',lname:'Cabahug',phone:'09267890123',address:'Hinundayan',area:'Hinundayan',loantype:'Business Loan',amount:15000,approved_amount:0,purpose:'Sari-sari store restocking',income:8000,payment:'Weekly',date:todayStr,time:'09:00',status:'new',assignedTo:'u4'},
    ];
    txCounter=2;appCounter=2;trCounter=1;
    saveData();
  }
  populateLoginDropdown();
}

function populateLoginDropdown(){
  const sel=document.getElementById('loginUser');
  sel.innerHTML='<option value="">-- Select your name --</option>'+users.map(u=>`<option value="${u.id}">${u.name} (${u.role==='officer'?u.area:u.role})</option>`).join('');
}

function doLogin(){
  const uid=document.getElementById('loginUser').value;
  const pin=document.getElementById('loginPin').value;
  const err=document.getElementById('loginError');
  if(!uid){err.textContent='Please select your account.';err.style.display='block';return;}
  const user=users.find(u=>u.id===uid);
  if(!user||pin!==user.pin){err.style.display='block';return;}
  err.style.display='none';
  currentUser=user;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  document.getElementById('topbar-name').textContent=user.name;
  document.getElementById('topbar-area').textContent=user.area;
  document.getElementById('role-badge-wrap').innerHTML=`<span class="role-badge ${user.role}">${roleLabel(user.role)}</span>`;
  buildTabs();switchTab('dashboard');
}

function doLogout(){currentUser=null;document.getElementById('loginScreen').style.display='flex';document.getElementById('mainApp').style.display='none';document.getElementById('loginPin').value='';document.getElementById('loginUser').value='';}
function roleLabel(r){return r==='officer'?'Account Officer':r==='supervisor'?'Loan Supervisor':r==='manager'?'Manager':'Admin';}
function canSee(role){const r=currentUser?.role;if(r==='admin')return true;if(r==='manager')return['manager','supervisor','officer'].includes(role);if(r==='supervisor')return['supervisor','officer'].includes(role);return r===role;}
function isSupOrAbove(){return['supervisor','manager','admin'].includes(currentUser?.role);}
function isMgrOrAbove(){return['manager','admin'].includes(currentUser?.role);}

function getVisibleMembers(){
  if(!currentUser)return[];
  if(isSupOrAbove())return members;
  return members.filter(m=>m.assignedTo===currentUser.id);
}
function getVisibleApplications(){
  if(!currentUser)return[];
  if(isSupOrAbove())return applications;
  return applications.filter(a=>a.assignedTo===currentUser.id);
}
function getPendingTransfers(){
  // Transfers that need action from current user's role
  const r=currentUser?.role;
  if(r==='officer')return transferRequests.filter(t=>t.requestedBy===currentUser.id);
  if(r==='supervisor')return transferRequests.filter(t=>t.status==='pending-sup'||t.requestedBy===currentUser.id);
  if(r==='manager'||r==='admin')return transferRequests.filter(t=>t.status==='pending-mgr'||t.status==='pending-sup'||t.requestedBy===currentUser.id);
  return[];
}
function getPendingApprovalsCount(){
  const r=currentUser?.role;
  if(r==='supervisor')return transferRequests.filter(t=>t.status==='pending-sup').length;
  if(r==='manager'||r==='admin')return transferRequests.filter(t=>t.status==='pending-mgr').length;
  return 0;
}

function buildTabs(){
  const r=currentUser.role;
  const pendingCount=getPendingApprovalsCount();
  const tabs=[
    {id:'dashboard',label:'Dashboard'},
    {id:'applications',label:'Loan Applications'},
    {id:'members',label:'Members'},
    {id:'collect',label:'Record Payment'},
    {id:'history',label:'History'},
    {id:'report',label:'Reports'},
    {id:'transfers',label:'Transfers'+(pendingCount>0?` (${pendingCount})`:'')},
  ];
  if(r==='admin'||r==='manager'||r==='supervisor')tabs.push({id:'users',label:'Staff Accounts'});
  tabs.push({id:'settings',label:'Settings'});
  document.getElementById('main-tabs').innerHTML=tabs.map((t,i)=>`<button class="tab${i===0?' active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');
}

const paidToday=mId=>transactions.filter(t=>t.memberId===mId&&t.date===todayStr&&(t.type==='loan'||t.type==='penalty')).reduce((s,t)=>s+Number(t.amount),0);

function switchTab(name){
  ['dashboard','applications','members','add-member','collect','history','report','transfers','users','settings'].forEach(n=>{const el=document.getElementById('tab-'+n);if(el)el.style.display='none';});
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('tab-'+name);if(el)el.style.display='';
  document.querySelectorAll('.tab').forEach(btn=>{if(btn.getAttribute('onclick')?.includes("'"+name+"'"))btn.classList.add('active');});
  if(name==='dashboard'){fetchAndMergeApplications().then(()=>renderDashboard());}
  else if(name==='applications'){fetchAndMergeApplications().then(()=>renderApplications());}
  else if(name==='members')renderMembers();
  else if(name==='collect')renderCollect();
  else if(name==='history')renderHistory();
  else if(name==='report')renderReport();
  else if(name==='transfers')renderTransfers();
  else if(name==='users')renderUsers();
  else if(name==='settings')renderSettings();
}

const N8N_SYNC_MEMBER='https://patriciatelen14.app.n8n.cloud/webhook/sync-member';

async function syncMemberToSheets(member,action='add'){
  try{
    await fetch(N8N_SYNC_MEMBER,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        action, // 'add' or 'update'
        member_id:member.id,
        name:member.name,
        contact:member.contact,
        address:member.address,
        area:member.area,
        assigned_officer:users.find(u=>u.id===member.assignedTo)?.name||'',
        account_type:member.type,
        schedule:member.sched,
        due_amount:member.dueAmount,
        loan_total:member.loanTotal,
        loan_balance:member.loanBal,
        source:member.source||'',
        synced_at:new Date().toISOString()
      })
    });
  }catch(e){console.warn('Member sync to Sheets failed:',e);}
}

// Sync all existing members to Google Sheets (one-time or on demand)
async function syncAllMembersToSheets(){
  showToast('Syncing all members to Google Sheets...');
  let synced=0;
  for(const m of members){
    await syncMemberToSheets(m,'add');
    synced++;
  }
  showToast(synced+' members synced to Google Sheets!');
}

const N8N_GET_APPS='https://patriciatelen14.app.n8n.cloud/webhook/get-applications';
const N8N_GET_MEMBER='https://patriciatelen14.app.n8n.cloud/webhook/get-member-portal';

// Fetch applications from Google Sheets via n8n and merge with local
async function fetchAndMergeApplications(){
  try{
    const r=await fetch(N8N_GET_APPS,{method:'GET',headers:{'Content-Type':'application/json'}});
    if(!r.ok)throw new Error('Failed');
    const sheetData=await r.json();
    if(!Array.isArray(sheetData)||!sheetData.length)return;
    // Map Google Sheets column names to our application object format
    const sheetsApps=sheetData.map(row=>({
      id:row['Reference']||row.Reference||'',
      fname:(row['First Name']||row['First_Name']||'').split(' ')[0]||'',
      lname:row['Last Name']||row['Last_Name']||'',
      phone:row['Phone']||'',
      address:row['Address']||'',
      area:row['Area']||'',
      loantype:row['Loan Type']||row['Loan_Type']||'',
      amount:Number(row['Amount'])||0,
      purpose:row['Purpose']||'',
      income:Number(row['Monthly Income']||row['Income'])||0,
      payment:row['Payment Schedule']||row['Payment_Schedule']||'',
      date:row['Date Submitted']||row['Date_Submitted']||'',
      status:row['Status']||'new',
      approved_amount:Number(row['Approved Amount']||row['Approved_Amount'])||0,
      applicant_type:row['Applicant Type']||row['Applicant_Type']||'new',
      member_id_ref:row['Member ID Ref']||row['Member_ID_Ref']||'',
      time:row['Time']||''
    })).filter(a=>a.id); // only valid rows with reference number
    // Merge: add sheets apps that are not already in local applications
    let added=0;
    sheetsApps.forEach(sa=>{
      const existing=applications.find(a=>a.id===sa.id);
      if(!existing){applications.push(sa);added++;}
      else{
        // Update status from sheets (sheets is source of truth for status)
        existing.status=sa.status;
        existing.approved_amount=sa.approved_amount;
      }
    });
    if(added>0){saveData();showToast(added+' new application(s) synced from Google Sheets!');}
  }catch(e){
    console.warn('Could not sync from Google Sheets:',e);
  }
}

function showPartialInput(appId,reqAmt){document.getElementById('partial-input-'+appId).style.display='';}
function processPartial(appId,requestedAmt){const approvedAmt=Number(document.getElementById('partial-amt-'+appId).value);if(!approvedAmt||approvedAmt<=0){showToast('Enter a valid amount.');return;}if(approvedAmt>=requestedAmt){showToast('Partial must be less than requested.');return;}processLoan(appId,'partial-approval',requestedAmt,approvedAmt);}

function processLoan(appId,status,requestedAmt,approvedAmt){
  const a=applications.find(x=>x.id===appId);if(!a)return;
  a.status=status;a.approved_amount=approvedAmt;saveData();
  const payload={ref:a.id,status:status,fname:a.fname,lname:a.lname,phone:a.phone,area:a.area||'',loantype:a.loantype,amount:requestedAmt,approved_amount:approvedAmt,date:new Date().toISOString().split('T')[0],processed_by:currentUser?currentUser.name:'Supervisor',processed_by_role:currentUser?currentUser.role:'supervisor'};
  const N8N_STATUS='https://patriciatelen14.app.n8n.cloud/webhook/update-application-status';
  fetch(N8N_STATUS,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
  .then(()=>showToast('Decision synced to Google Sheets via n8n!'))
  .catch(err=>{console.warn('n8n sync error:',err);showToast('Decision saved locally. Check n8n connection.');});
  const smsText=buildDecisionSms(a,status,requestedAmt,approvedAmt);
  const smsNum=a.phone.replace(/\D/g,'');
  showDecisionPopup(a,status,smsText,smsNum);
  renderApplications();renderDashboard();
}

function buildDecisionSms(a,status,req,app){
  const name=a.fname+' '+a.lname;const coop=settings.coopName;
  if(status==='approved')return settings.smsApproved.replace('{name}',name).replace('{ref}',a.id).replace('{amount}',Number(req).toLocaleString('en-PH',{minimumFractionDigits:2})).replace('{coop}',coop);
  if(status==='rejected')return settings.smsRejected.replace('{name}',name).replace('{ref}',a.id).replace('{amount}',Number(req).toLocaleString('en-PH',{minimumFractionDigits:2})).replace('{coop}',coop);
  if(status==='partial-approval')return settings.smsPartial.replace('{name}',name).replace('{ref}',a.id).replace('{amount}',Number(req).toLocaleString('en-PH',{minimumFractionDigits:2})).replace('{approved_amount}',Number(app).toLocaleString('en-PH',{minimumFractionDigits:2})).replace('{coop}',coop);
  return '';
}

function showDecisionPopup(a,status,smsText,smsNum){
  const labels={approved:'APPROVED ✓',rejected:'REJECTED','partial-approval':'PARTIALLY APPROVED'};
  const colors={approved:'var(--green)',rejected:'var(--red)','partial-approval':'var(--amber)'};
  const popup=document.createElement('div');
  popup.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px';
  popup.innerHTML=`<div style="background:#fff;border-radius:16px;padding:28px;max-width:420px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2)">
    <div style="font-size:20px;font-weight:900;margin-bottom:4px;color:${colors[status]}">${labels[status]}</div>
    <div style="font-size:13px;color:#888;margin-bottom:16px">${a.fname} ${a.lname} · ${a.id}</div>
    <div style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;margin-bottom:6px">SMS to send to ${a.phone}:</div>
    <div class="sms-preview">${smsText}</div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <a href="sms:${smsNum}?body=${encodeURIComponent(smsText)}" style="text-decoration:none"><button class="btn warn">Send SMS</button></a>
      <button class="btn" onclick="copyText('${smsText.replace(/'/g,"\\'")}')">Copy SMS</button>
      <button class="btn primary" onclick="this.closest('[style*=fixed]').remove()">Close</button>
    </div>
  </div>`;
  document.body.appendChild(popup);
}

function convertToMember(appId){
  const a=applications.find(x=>x.id===appId);if(!a)return;
  renderAddMember(null,false,a);

function renderRecycleBin(){
  if(!deletedMembers.length)return`<div class="card" style="margin-bottom:14px;background:#fdecea;border:1.5px solid #f5b7b1"><div style="font-size:13px;color:var(--red);text-align:center;padding:12px">Recycle bin is empty.</div></div>`;
  const now=Date.now();
  const sevenDays=7*24*60*60*1000;
  return`<div class="card" style="margin-bottom:14px;border:1.5px solid #f5b7b1;background:#fdecea">
    <div style="font-size:12px;font-weight:700;color:var(--red);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em">🗑 Recycle Bin — Deleted members are permanently removed after 7 days</div>
    ${deletedMembers.map(m=>{
      const daysLeft=Math.max(0,Math.ceil((m.deletedAt+sevenDays-now)/(24*60*60*1000)));
      return`<div style="background:#fff;border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div><div style="font-weight:600">${m.name}</div><div style="font-size:11px;color:#888">${m.id} · Deleted by ${m.deletedBy||'Supervisor'} · ${daysLeft} day(s) left</div></div>
        <button class="btn sm green" onclick="restoreMember('${m.id}')">Restore</button>
      </div>`;
    }).join('')}
  </div>`;
}

function deleteMember(mId){
  if(!confirm('Delete this member? They will be moved to the Recycle Bin and permanently removed after 7 days.'))return;
  const idx=members.findIndex(m=>m.id===mId);if(idx===-1)return;
  const m={...members[idx],deletedAt:Date.now(),deletedBy:currentUser?currentUser.name:'Supervisor'};
  deletedMembers.push(m);
  members.splice(idx,1);
  saveData();
  showToast('Member moved to Recycle Bin. Can be restored within 7 days.');
  renderMembers();
}

function restoreMember(mId){
  const idx=deletedMembers.findIndex(m=>m.id===mId);if(idx===-1)return;
  const m={...deletedMembers[idx]};
  delete m.deletedAt;delete m.deletedBy;
  members.push(m);
  deletedMembers.splice(idx,1);
  saveData();
  showToast('Member restored successfully!');
  renderMembers(true);
}

function saveMember(appId){
  const name=document.getElementById('m-name').value.trim();
  const id=document.getElementById('m-id').value.trim();
  if(!name||!id){showToast('Name and ID required.');return;}
  if(!editingMemberId&&members.find(m=>m.id===id)){showToast('ID already exists!');return;}
  const existing=editingMemberId?members.find(m=>m.id===editingMemberId):null;
  const isOfficer=currentUser.role==='officer';
  // Officers can only update personal fields — financial fields stay as they are
  const data={
    id,
    name,
    contact:document.getElementById('m-contact').value||'',
    address:document.getElementById('m-address').value||'',
    // Officers cannot change these — keep existing values if officer is editing
    area:isOfficer&&existing?existing.area:document.getElementById('m-area').value,
    assignedTo:isOfficer&&existing?existing.assignedTo:document.getElementById('m-assigned').value,
    type:isOfficer&&existing?existing.type:document.getElementById('m-type').value,
    sched:isOfficer&&existing?existing.sched:document.getElementById('m-sched').value,
    dueAmount:isOfficer&&existing?existing.dueAmount:Number(document.getElementById('m-due').value)||0,
    loanTotal:isOfficer&&existing?existing.loanTotal:Number(document.getElementById('m-loan-total').value)||0,
    loanBal:isOfficer&&existing?existing.loanBal:Number(document.getElementById('m-loan-bal').value)||0,
    source:isOfficer&&existing?existing.source:document.getElementById('m-source').value
  };
  if(editingMemberId){const idx=members.findIndex(m=>m.id===editingMemberId);members[idx]=data;showToast('Member updated!');syncMemberToSheets(data,'update');}
  else{members.push(data);showToast('Member registered!');syncMemberToSheets(data,'add');}
  saveData();switchTab('members');
}

function doPrint(txId,memberName,amount,date,type,remaining,notes,time,area){
  const w=window.open('','_blank','width=420,height=640');
  w.document.write(`<!DOCTYPE html><html><head><title>Receipt ${txId}</title><style>body{font-family:Arial,sans-serif;font-size:13px;padding:24px;max-width:360px;margin:0 auto}h2{font-size:15px;color:#0a0a0a;margin-bottom:2px}h3{font-size:11px;color:#888;font-weight:normal;margin-bottom:16px}table{width:100%;border-collapse:collapse}td{padding:6px 0;font-size:12px;vertical-align:top}td:first-child{color:#888;width:45%}.amount{font-size:20px;font-weight:bold;color:#1a8a3c}.divider{border:none;border-top:1px dashed #ccc;margin:12px 0}.footer{font-size:10px;color:#aaa;text-align:center;margin-top:16px;line-height:1.6}@media print{button{display:none}}</style></head><body>
  <h2>${settings.coopName}</h2><h3>Official Collection Receipt</h3><div class="divider"></div>
  <table><tr><td>Ref No.</td><td><b>${txId}</b></td></tr><tr><td>Member</td><td>${memberName}</td></tr><tr><td>Area</td><td>${area}</td></tr><tr><td>Type</td><td>${type}</td></tr><tr><td>Amount Paid</td><td class="amount">₱${Number(amount).toLocaleString('en-PH',{minimumFractionDigits:2})}</td></tr><tr><td>Date & Time</td><td>${date} ${time}</td></tr>${remaining?`<tr><td>Remaining</td><td>₱${Number(remaining).toLocaleString('en-PH',{minimumFractionDigits:2})}</td></tr>`:''}${notes?`<tr><td>Notes</td><td>${notes}</td></tr>`:''}<tr><td>Collector</td><td>${currentUser?currentUser.name:''}</td></tr></table>
  <div class="divider"></div><div class="footer">Official receipt of ${settings.coopName}<br>${settings.address||'Southern Leyte, Philippines'}</div>
  <br><button onclick="window.print()" style="padding:8px 20px;background:#0a0a0a;color:#fff;border:none;border-radius:6px;cursor:pointer">Print</button>
  </body></html>`);w.document.close();setTimeout(()=>w.print(),400);

function generateReport(){
  const date=document.getElementById('rpt-date').value;
  const aF=document.getElementById('rpt-area')?document.getElementById('rpt-area').value:'';
  const vm=getVisibleMembers();const fM=aF?vm.filter(m=>m.area===aF):vm;
  const tx=transactions.filter(t=>t.date===date&&fM.find(m=>m.id===t.memberId));
  lastReportDate=date;lastReportTx=tx;
  const total=tx.reduce((s,t)=>s+Number(t.amount),0);
  const byType={loan:0,savings:0,penalty:0,other:0};tx.forEach(t=>byType[t.type]=(byType[t.type]||0)+Number(t.amount));
  const paidSet=[...new Set(tx.map(t=>t.memberId))];
  const unpaid=fM.filter(m=>m.type!=='savings'&&!paidSet.includes(m.id));
  const byArea={};AREAS.forEach(a=>{if(!aF||aF===a){const atx=tx.filter(t=>t.memberArea===a);byArea[a]={total:atx.reduce((s,t)=>s+Number(t.amount),0),count:atx.length};}});
  document.getElementById('rpt-xl').style.display='';document.getElementById('rpt-pr').style.display='';
  document.getElementById('report-output').innerHTML=`<div class="card">
    <div style="font-weight:700;font-size:15px;margin-bottom:4px">Daily Collection Report</div>
    <div style="font-size:11px;color:#888;margin-bottom:14px">${date} · ${settings.coopName} · ${aF||'All Areas'} · ${currentUser.name}</div>
    <div class="divider"></div>
    <div class="stat-grid" style="margin-bottom:14px">
      <div class="stat"><div class="stat-label">Total Collected</div><div class="stat-value green">${fmt(total)}</div></div>
      <div class="stat"><div class="stat-label">Transactions</div><div class="stat-value blue">${tx.length}</div></div>
      <div class="stat"><div class="stat-label">Members Paid</div><div class="stat-value">${paidSet.length}</div></div>
      <div class="stat"><div class="stat-label">Unpaid</div><div class="stat-value red">${unpaid.length}</div></div>
    </div>
    ${!aF?`<div class="section-label">By Area</div>${Object.entries(byArea).map(([area,d])=>`<div class="sb"><span class="area-pill">${area}</span><div><span style="font-weight:700">${fmt(d.total)}</span><span style="font-size:11px;color:#888;margin-left:8px">${d.count} transactions</span></div></div>`).join('')}`:''}
    <div class="section-label">By Payment Type</div>
    ${Object.entries(byType).filter(([,v])=>v>0).map(([k,v])=>`<div class="sb"><span style="font-weight:600">${k.charAt(0).toUpperCase()+k.slice(1)}</span><span style="font-weight:700">${fmt(v)}</span></div>`).join('')}
    ${unpaid.length?`<div class="section-label" style="color:var(--red)">Unpaid Members (${unpaid.length})</div>${unpaid.map(m=>`<div class="sb"><div><div style="font-weight:600">${m.name}</div><div style="font-size:10px;color:#888">${m.id} · ${m.contact}</div></div><div><span class="area-pill">${m.area}</span><span class="badge unpaid" style="margin-left:6px">${fmt(m.dueAmount)} due</span></div></div>`).join('')}`:''}
    ${tx.length?`<div class="section-label">All Transactions</div><div style="overflow-x:auto"><table><thead><tr><th>Ref</th><th>Member</th><th>Area</th><th>Type</th><th>Amount</th><th>Time</th><th>Collector</th></tr></thead><tbody>${tx.map(t=>`<tr><td style="font-family:monospace;font-size:10px">${t.id}</td><td>${t.memberName}</td><td><span class="area-pill">${t.memberArea||'—'}</span></td><td><span class="badge ${t.type}">${t.type}</span></td><td>${fmt(t.amount)}</td><td style="font-size:11px;color:#888">${t.time||'—'}</td><td style="font-size:11px">${t.collectorName||'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No transactions for this date.</div>'}
  </div>`;
}

function exportReportExcel(){
  if(!lastReportDate||!window.XLSX){showToast('Generate a report first.');return;}
  const wb=XLSX.utils.book_new();const total=lastReportTx.reduce((s,t)=>s+Number(t.amount),0);
  const summary=[['Daily Report — '+settings.coopName],['Date:',lastReportDate,'By:',currentUser.name,'Role:',currentUser.role],[],['Total Collected',total],['Transactions',lastReportTx.length],[],['Ref','Member','Area','Type','Amount','Time','Collector','Notes'],...lastReportTx.map(t=>[t.id,t.memberName,t.memberArea||'',t.type,Number(t.amount),t.time||'',t.collectorName||'',t.notes||''])];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(summary),'Report');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(getVisibleMembers().map(m=>({'ID':m.id,'Name':m.name,'Contact':m.contact,'Area':m.area,'Source':m.source||'','Type':m.type,'Schedule':m.sched,'Due':m.dueAmount,'Balance':m.loanBal,'Officer':users.find(u=>u.id===m.assignedTo)?.name||''}))),'Members');

}

  </body></html>`);w.document.close();setTimeout(()=>w.print(),400);
}

function submitTransferRequest(){

function submitBulkTransfer(){
  const fromId=document.getElementById('bt-from').value;
  const toId=document.getElementById('bt-to').value;
  const tType=document.getElementById('bt-type').value;
  const reason=document.getElementById('bt-reason').value;

  if(!fromId||!toId||!selected.length){showToast('Select source, destination, and at least 1 member.');return;}

  const fromUser=users.find(u=>u.id===fromId);
  const toUser=users.find(u=>u.id===toId);
  const memberNames=selected.map(id=>members.find(m=>m.id===id)?.name||id).join(', ');
  transferRequests.push({id:trId,type:'bulk',transferType:tType,memberId:null,memberName:`${selected.length} members`,memberArea:'Multiple',memberIds:selected,fromCollectorId:fromId,fromCollectorName:fromUser?.name||'',toCollectorId:toId,toCollectorName:toUser?.name||'',toArea:toUser?.area||'',requestedBy:currentUser.id,requestedByName:currentUser.name,requestedDate:todayStr,reason,notes:memberNames,status:'pending-sup',supApprovalBy:null,supApprovalDate:null,mgrApprovalBy:null,mgrApprovalDate:null});

        <div style="font-weight:700">${t.type==='bulk'?'BULK: '+t.memberName:t.memberName}</div>
        <div style="font-size:10px;color:#888">${t.id} · Requested by ${t.requestedByName} · ${t.requestedDate}</div>
        <div style="font-size:11px;color:#888;margin-top:4px">
          From: <b>${t.fromCollectorName}</b> → To: <b>${t.toCollectorName}</b> (${t.toArea})
        </div>
      </div>
      <div style="text-align:right">
        <span class="badge ${t.status==='approved'?'approved':t.status==='rejected'?'rejected':t.status==='pending-sup'?'pending':'pending-mgr'}">${statusLabel[t.status]||t.status}</span>
        <div style="font-size:10px;color:#888;margin-top:4px">${t.transferType==='full'?'Full File Transfer':'Clean Transfer'}</div>
      </div>
    </div>
    <div class="info-grid" style="margin-bottom:10px">
      <div class="lbl">Reason</div><div class="val">${t.reason.replace(/-/g,' ')}</div>
      ${t.notes&&t.type!=='bulk'?`<div class="lbl">Notes</div><div class="val">${t.notes}</div>`:''}
      ${t.supApprovalBy?`<div class="lbl">Sup. Approved by</div><div class="val">${users.find(u=>u.id===t.supApprovalBy)?.name||t.supApprovalBy} · ${t.supApprovalDate}</div>`:''}
      ${t.mgrApprovalBy?`<div class="lbl">Mgr. Approved by</div><div class="val">${users.find(u=>u.id===t.mgrApprovalBy)?.name||t.mgrApprovalBy} · ${t.mgrApprovalDate}</div>`:''}
    </div>
    ${canApprove&&showApprove?`<div style="display:flex;gap:7px;flex-wrap:wrap">
      <button class="btn sm green" onclick="approveTransfer('${t.id}')">Approve</button>
      <button class="btn sm danger" onclick="rejectTransfer('${t.id}')">Reject</button>
    </div>`:''}
    ${t.status==='approved'?'<div style="font-size:11px;color:var(--green);font-weight:700">✓ Transfer completed successfully</div>':''}
  </div>`;
}

function approveTransfer(trId){
  const t=transferRequests.find(x=>x.id===trId);if(!t)return;
  const r=currentUser.role;
  if(r==='supervisor'&&t.status==='pending-sup'){
    t.status='pending-mgr';t.supApprovalBy=currentUser.id;t.supApprovalDate=todayStr;
    showToast('Approved by Supervisor. Now awaiting Manager approval.');
  } else if((r==='manager'||r==='admin')&&t.status==='pending-mgr'){
    t.status='approved';t.mgrApprovalBy=currentUser.id;t.mgrApprovalDate=todayStr;
    executeTransfer(t);
    showToast('Transfer fully approved and completed!');
  }
  saveData();buildTabs();renderTransfers();
}

function rejectTransfer(trId){
  const t=transferRequests.find(x=>x.id===trId);if(!t)return;
  t.status='rejected';saveData();
  showToast('Transfer request rejected.');buildTabs();renderTransfers();
}

function executeTransfer(t){
  const mIds=t.type==='bulk'?t.memberIds:[t.memberId];
  mIds.forEach(mId=>{
    const m=members.find(x=>x.id===mId);if(!m)return;
    const toUser=users.find(u=>u.id===t.toCollectorId);
    const fromName=m.assignedTo;
    m.assignedTo=t.toCollectorId;
    m.area=toUser?.area||m.area;
    if(t.transferType==='full'){
      // Update all transactions for this member
      transactions.filter(tx=>tx.memberId===mId).forEach(tx=>{tx.memberArea=toUser?.area||tx.memberArea;});
    }
    // Add to transfer log
    transferLog.push({id:'TL-'+String(transferLog.length+1).padStart(4,'0'),transferRequestId:t.id,memberId:mId,memberName:m.name,fromCollector:t.fromCollectorName,toCollector:t.toCollectorName,toArea:toUser?.area||'',transferType:t.transferType,date:todayStr,approvedBySup:users.find(u=>u.id===t.supApprovalBy)?.name||'',approvedByMgr:users.find(u=>u.id===t.mgrApprovalBy)?.name||'',reason:t.reason});
  });
}

function renderTransferLog(){
  const el=document.getElementById('transfer-log');if(!el)return;
  el.innerHTML=transferLog.length?[...transferLog].reverse().map(l=>`
    <div class="log-entry">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px">
        <div><div style="font-weight:700">${l.memberName}</div><div style="font-size:10px;color:#888">${l.memberId} · ${l.date} · ${l.transferType==='full'?'Full File Transfer':'Clean Transfer'}</div></div>
        <span class="badge approved">Completed</span>
      </div>
      <div class="info-grid" style="margin-top:8px">
        <div class="lbl">From</div><div class="val">${l.fromCollector}</div>
        <div class="lbl">To</div><div class="val">${l.toCollector} (${l.toArea})</div>
        <div class="lbl">Approved by Sup.</div><div class="val">${l.approvedBySup||'—'}</div>
        <div class="lbl">Approved by Mgr.</div><div class="val">${l.approvedByMgr||'—'}</div>
        <div class="lbl">Reason</div><div class="val">${l.reason.replace(/-/g,' ')}</div>
      </div>
    </div>`).join(''):'<div class="empty">No completed transfers yet.</div>';
}

// ─── USERS ───
function renderUsers(viewMembersOfUserId=null){
  if(!isSupOrAbove()){document.getElementById('tab-users').innerHTML='<div class="empty"><h3>Access Restricted</h3></div>';return;}
  const el=document.getElementById('tab-users');
  // If viewing members of a specific officer
  if(viewMembersOfUserId){
    const u=users.find(x=>x.id===viewMembersOfUserId);
    const uMembers=members.filter(m=>m.assignedTo===viewMembersOfUserId);
    el.innerHTML=`
    <div style="margin-bottom:14px">
      <button class="btn" onclick="renderUsers()" style="margin-bottom:12px">← Back to Staff Accounts</button>
      <div class="card">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
          <div class="av" style="width:44px;height:44px;font-size:15px">${ini(u.name)}</div>
          <div>
            <div style="font-weight:700;font-size:15px">${u.name}</div>
            <div style="font-size:12px;color:#888"><span class="role-badge ${u.role}" style="display:inline-block">${roleLabel(u.role)}</span> · <span class="area-pill">${u.area}</span></div>
          </div>
          <div style="margin-left:auto;text-align:right">
            <div style="font-size:22px;font-weight:800;color:var(--green)">${uMembers.length}</div>
            <div style="font-size:11px;color:#888">Assigned Members</div>
          </div>
        </div>
        ${uMembers.length?`<div style="overflow-x:auto"><table><thead><tr><th>Member</th><th>Area</th><th>Type</th><th>Due/Period</th><th>Balance</th><th>Today</th></tr></thead><tbody>${
          uMembers.map(m=>{const paid=paidToday(m.id);const st=m.type==='savings'?'savings':paid>=m.dueAmount?'paid':paid>0?'partial':'unpaid';
            return`<tr><td><div class="mc"><div class="av">${ini(m.name)}</div><div><div style="font-weight:600">${m.name}</div><div style="font-size:10px;color:#888">${m.id} · ${m.contact}</div></div></div></td>
            <td><span class="area-pill">${m.area}</span></td><td>${m.type}</td><td>${fmt(m.dueAmount)}</td>
            <td>${m.loanBal>0?fmt(m.loanBal):'—'}</td><td><span class="badge ${st}">${st}</span></td></tr>`;
          }).join('')
        }</tbody></table></div>`:'<div class="empty">No members assigned to this officer yet.</div>'}
      </div>
    </div>`;
    return;
  }
  el.innerHTML=`<div class="card"><div class="card-header"><div class="card-title">Staff Accounts</div><button class="btn primary" onclick="showAddUser()">+ Add Staff</button></div>
  <div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Role</th><th>Area</th><th>Members</th><th>PIN</th><th></th></tr></thead><tbody>${
    users.map(u=>{
      const memberCount=members.filter(m=>m.assignedTo===u.id).length;
      return`<tr>
        <td><div style="font-weight:600;cursor:pointer;color:var(--green)" onclick="renderUsers('${u.id}')">${u.name}</div>
        <div style="font-size:10px;color:#888">Click to view members</div></td>
        <td><span class="role-badge ${u.role}" style="display:inline-block">${roleLabel(u.role)}</span></td>
        <td><span class="area-pill">${u.area}</span></td>
        <td><span style="font-weight:700;color:var(--green)">${memberCount}</span> <span style="font-size:11px;color:#888">members</span></td>
        <td style="font-family:monospace;letter-spacing:.2em">${'•'.repeat(u.pin.length)}</td>
        <td><button class="btn sm" onclick="editUserPin('${u.id}')">Edit PIN</button></td>
      </tr>`;
    }).join('')
  }</tbody></table></div></div>
  <div id="user-form" style="display:none"></div>`;
}

function showAddUser(){
  document.getElementById('user-form').style.display='';
  document.getElementById('user-form').innerHTML=`<div class="card"><div class="card-title" style="margin-bottom:14px">Add Staff Account</div>
    <div class="row2"><div><div class="fl">Full Name</div><input id="u-name" placeholder="Staff full name"></div>
    <div><div class="fl">Role</div><select id="u-role"><option value="officer">Account Officer</option><option value="supervisor">Loan Supervisor</option><option value="manager">Manager</option><option value="admin">Admin</option></select></div></div>
    <div class="row2"><div><div class="fl">Area Assignment</div><select id="u-area"><option value="All Branches">All Branches</option>${AREAS.map(a=>`<option value="${a}">${a}</option>`).join('')}</select></div>
    <div><div class="fl">Initial PIN</div><input type="password" id="u-pin" placeholder="Set a PIN"></div></div>
    <div class="btn-row"><button class="btn" onclick="document.getElementById('user-form').style.display='none'">Cancel</button><button class="btn primary" onclick="saveNewUser()">Save Staff</button></div>
  </div>`;
}

function saveNewUser(){const name=document.getElementById('u-name').value.trim();const pin=document.getElementById('u-pin').value;if(!name||!pin){showToast('Name and PIN required.');return;}users.push({id:'u'+Date.now(),name,role:document.getElementById('u-role').value,area:document.getElementById('u-area').value,pin});saveData();showToast('Staff added!');renderUsers();populateLoginDropdown();}
function editUserPin(uid){document.getElementById('user-form').style.display='';const u=users.find(x=>x.id===uid);document.getElementById('user-form').innerHTML=`<div class="card"><div class="card-title" style="margin-bottom:14px">Edit PIN — ${u.name}</div><div class="row2"><div><div class="fl">New PIN</div><input type="password" id="ep-new" placeholder="New PIN"></div><div><div class="fl">Confirm PIN</div><input type="password" id="ep-confirm" placeholder="Confirm PIN"></div></div><div class="btn-row"><button class="btn" onclick="document.getElementById('user-form').style.display='none'">Cancel</button><button class="btn primary" onclick="saveUserPin('${uid}')">Update PIN</button></div></div>`;}
function saveUserPin(uid){const np=document.getElementById('ep-new').value;const cp=document.getElementById('ep-confirm').value;if(!np){showToast('Enter a new PIN.');return;}if(np!==cp){showToast('PINs do not match!');return;}users.find(u=>u.id===uid).pin=np;saveData();showToast('PIN updated!');renderUsers();}

// ─── SETTINGS ───
function renderSettings(){
  document.getElementById('tab-settings').innerHTML=`<div class="card">
    <div class="card-title" style="margin-bottom:14px">Cooperative Information</div>
    <div class="row2"><div><div class="fl">Cooperative Name</div><input id="s-coop" value="${settings.coopName}"></div><div><div class="fl">Office Address</div><input id="s-addr" value="${settings.address}"></div></div>
    <div><div class="fl">Contact Number / Email</div><input id="s-contact" value="${settings.contact}" style="margin-bottom:14px"></div>
    <div class="card-title" style="margin-bottom:12px">Change My PIN</div>
    <div class="row2"><div><div class="fl">New PIN</div><input type="password" id="s-pin-new" placeholder="New PIN"></div><div><div class="fl">Confirm PIN</div><input type="password" id="s-pin-confirm" placeholder="Confirm"></div></div>
    <div class="card-title" style="margin:14px 0 12px">SMS Message Templates</div>
    <div class="tpl-box"><label>Payment Receipt SMS</label><textarea id="s-sms-pay" rows="2" style="font-size:12px;resize:vertical">${settings.smsPayment}</textarea></div>
    <div class="tpl-box" style="border-left-color:var(--green)"><label>Loan APPROVED SMS</label><textarea id="s-sms-approved" rows="2" style="font-size:12px;resize:vertical">${settings.smsApproved}</textarea></div>
    <div class="tpl-box" style="border-left-color:var(--amber)"><label>Loan PARTIALLY APPROVED SMS</label><textarea id="s-sms-partial" rows="2" style="font-size:12px;resize:vertical">${settings.smsPartial}</textarea></div>
    <div class="tpl-box" style="border-left-color:var(--red)"><label>Loan REJECTED SMS</label><textarea id="s-sms-rejected" rows="2" style="font-size:12px;resize:vertical">${settings.smsRejected}</textarea></div>
    <div style="font-size:11px;color:#888;margin-bottom:14px">Variables: {name} · {ref} · {amount} · {approved_amount} · {balance} · {date} · {coop}</div>
    <div class="btn-row">
      ${isSupOrAbove()?`<button class="btn info" onclick="syncAllMembersToSheets()" title="Sync all members from dashboard to Google Sheets">Sync Members to Sheets</button>`:''}
      ${currentUser?.role==='admin'?`<button class="btn danger" onclick="clearAllData()">Clear All Data</button>`:''}
      <button class="btn primary" onclick="saveSettings()">Save Settings</button>
    </div>
  </div>
  <div class="card"><div class="card-title" style="margin-bottom:8px">System Info</div>
    <div style="font-size:12px;color:#888;line-height:1.8">Members: <b>${members.length}</b> · Transactions: <b>${transactions.length}</b> · Applications: <b>${applications.length}</b> · Staff: <b>${users.length}</b> · Transfer Requests: <b>${transferRequests.length}</b> · Transfer Log Entries: <b>${transferLog.length}</b><br>Logged in as: <b>${currentUser?.name}</b> · Role: <b>${currentUser?.role}</b> · Area: <b>${currentUser?.area}</b><br>Data saved in browser local storage. Export Excel regularly as backup.</div>
  </div>`;
}

function saveSettings(){
  const np=document.getElementById('s-pin-new').value;const cp=document.getElementById('s-pin-confirm').value;
  if(np&&np!==cp){showToast('PINs do not match!');return;}
  settings={...settings,coopName:document.getElementById('s-coop').value||settings.coopName,address:document.getElementById('s-addr').value||'',contact:document.getElementById('s-contact').value||'',smsPayment:document.getElementById('s-sms-pay').value,smsApproved:document.getElementById('s-sms-approved').value,smsPartial:document.getElementById('s-sms-partial').value,smsRejected:document.getElementById('s-sms-rejected').value};
  if(np){const u=users.find(x=>x.id===currentUser.id);if(u){u.pin=np;currentUser.pin=np;}}
  try{localStorage.setItem(KEYS.s,JSON.stringify(settings));}catch(e){}
  saveData();document.getElementById('s-pin-new').value='';document.getElementById('s-pin-confirm').value='';
  showToast('Settings saved!');
}

function clearAllData(){if(!confirm('Delete ALL data permanently? Cannot be undone.'))return;members=[];transactions=[];applications=[];transferRequests=[];transferLog=[];txCounter=1;appCounter=1;trCounter=1;saveData();showToast('All data cleared.');renderDashboard();}

loadData();
</script>
